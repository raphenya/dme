# Builds, tests, and publishes the Python package to PyPI when a release is published.

name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip

      - name: Install system dependencies (BLAST, Prodigal)
        run: |
          sudo apt-get update
          sudo apt-get install -y ncbi-blast+ prodigal

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Lint (syntax errors and undefined names)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test
        run: pytest

      - name: Build distributions
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dme-app  # replace with your PyPI project name
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@8a08d616893759ef8e1aa1f2785787c0b97e20d6
        with:
          skip-existing: true
          verbose: true
          print-hash: true
          user: __token__
          password: ${{ secrets.PYPY_KEY }}
          repository-url: https://upload.pypi.org/legacy/